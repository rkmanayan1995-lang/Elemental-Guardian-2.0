<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CLASH OF GUARDIANS: HYPER BATTLE 2000 (MvC2 Arcade Tribute)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #05020c;
      color: #ffffff;
      font-family: 'Impact', 'Trebuchet MS', 'Arial Black', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      box-shadow: 0 0 50px rgba(180, 0, 255, 0.4), 0 0 100px rgba(0, 220, 255, 0.2);
    }
    canvas#viewport {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.35) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.04),
        rgba(0, 255, 0, 0.02),
        rgba(0, 255, 0, 0.04)
      );
      background-size: 100% 4px, 6px 100%;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.7);
      opacity: 1;
      transition: opacity 0.3s ease;
      z-index: 5;
    }
    .crt-overlay.disabled {
      opacity: 0;
    }
    #rematch-banner {
      position: absolute;
      top: 58%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }
    .btn-rematch {
      cursor: pointer;
      background: linear-gradient(180deg, #ffea00, #ff5500);
      color: #000;
      font-family: inherit;
      font-size: 20px;
      font-weight: 900;
      font-style: italic;
      padding: 12px 32px;
      border-radius: 30px;
      border: 3px solid #fff;
      box-shadow: 0 0 25px rgba(255, 234, 0, 0.8), 0 6px 0 #992200;
      text-transform: uppercase;
      letter-spacing: 2px;
      animation: pulseBtn 1s infinite alternate;
    }
    .btn-rematch:active {
      transform: translateY(4px);
      box-shadow: 0 0 10px rgba(255, 234, 0, 0.8), 0 2px 0 #992200;
    }
    @keyframes pulseBtn {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }
    #touch-controls {
      position: absolute;
      bottom: 8px;
      width: 96%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 15;
      pointer-events: none;
    }
    .touch-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .touch-btn {
      touch-action: manipulation;
      cursor: pointer;
      font-family: inherit;
      font-weight: 900;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 12px;
      color: #ffffff;
      background: rgba(14, 5, 30, 0.85);
      padding: 10px 14px;
      font-size: 13px;
      letter-spacing: 1px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
      transition: transform 0.08s, background 0.08s;
      min-width: 48px;
      text-align: center;
    }
    .touch-btn:active, .touch-btn.pressed {
      transform: scale(0.92);
      background: #ffea00;
      color: #000;
      border-color: #fff;
    }
    .btn-atk-light { border-color: #00f6ff; }
    .btn-atk-heavy { border-color: #ff0077; }
    .btn-atk-super { border-color: #ffea00; background: rgba(255, 234, 0, 0.25); }
    #top-bar {
      position: absolute;
      top: 6px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 15;
    }
    .btn-util {
      cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(10, 2, 24, 0.8);
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="viewport" width="640" height="360"></canvas>
    <div id="crt" class="crt-overlay"></div>

    <div id="top-bar">
      <button id="btn-restart-now" class="btn-util" style="background:#ff7700; color:#fff;">🔄 RESTART MATCH</button>
      <button id="toggle-crt" class="btn-util">CRT: ON/OFF</button>
      <button id="toggle-ai" class="btn-util" style="background:#00d9ff; color:#000;">AI: AUTO</button>
    </div>

    <div id="rematch-banner">
      <button id="btn-rematch" class="btn-rematch">⚔️ FIGHT AGAIN (REMATCH) ⚔️</button>
      <span style="font-size:12px; color:#ffe600; text-shadow:0 0 4px #000;">Or Press SPACE / ENTER</span>
    </div>

    <div id="touch-controls">
      <div class="touch-group">
        <button id="t-left" class="touch-btn">◀ LEFT</button>
        <button id="t-jump" class="touch-btn">▲ JUMP</button>
        <button id="t-right" class="touch-btn">RIGHT ▶</button>
      </div>

      <div class="touch-group">
        <button id="t-light" class="touch-btn btn-atk-light">Z: LIGHT</button>
        <button id="t-heavy" class="touch-btn btn-atk-heavy">X: HEAVY</button>
        <button id="t-super" class="touch-btn btn-atk-super">C: HYPER</button>
        <button id="t-assist" class="touch-btn">V: ASSIST</button>
      </div>
    </div>
  </div>

  <script>
  const CONFIG = {
    INTERNAL_WIDTH: 640,
    INTERNAL_HEIGHT: 360,
    GROUND_Y: 300,
    GRAVITY: 0.72,
    TIMER_START: 99,
    MAX_HEALTH: 1000,
    MAX_METER: 300
  };

  const PALETTE = {
    OUTLINE: '#090314',
    WHITE: '#ffffff',
    BLACK: '#020008',
    KAI: {
      SKIN_HI: '#ffe0bd', SKIN_BASE: '#f3b282', SKIN_SHADOW: '#aa5d3b',
      HAIR_HI: '#fffb96', HAIR_BASE: '#00f6ff', HAIR_SHADOW: '#007bb3',
      GI_HI: '#ffffff', GI_BASE: '#d6e6f5', GI_SHADOW: '#4c6589', GI_DEEP: '#1f2e46',
      BELT_BASE: '#ff1493', BELT_SHADOW: '#8c004a',
      GLOVE_HI: '#ffea00', GLOVE_BASE: '#ff7700', GLOVE_SHADOW: '#991100',
      ENERGY: '#00ffff'
    },
    VEXA: {
      SKIN_HI: '#ffffff', SKIN_BASE: '#eac8b8', SKIN_SHADOW: '#93605c',
      HAIR_HI: '#ff80bf', HAIR_BASE: '#ff0077', HAIR_SHADOW: '#88003a',
      ARMOR_HI: '#b066ff', ARMOR_BASE: '#491b7e', ARMOR_SHADOW: '#180731',
      CAPE_HI: '#ff3b30', CAPE_BASE: '#b30018', CAPE_SHADOW: '#4d0007',
      ENERGY: '#ff0055'
    },
    STAGE: {
      SKY_TOP: '#0d0426', SKY_MID: '#4a154b', SKY_LOW: '#d4422e', SKY_HORIZON: '#ffb338',
      WHEEL_LIGHTS: ['#ff0055', '#00ffff', '#ffe600', '#00ff66', '#b000ff']
    },
    HUD: {
      LIFE_GREEN: '#28e040', LIFE_YELLOW: '#ffd000', LIFE_RED: '#ff1b34', LIFE_GHOST: '#ff3019',
      LIFE_BG: '#1a052b', FRAME_GOLD: '#f5c518', FRAME_PURPLE: '#260f38',
      METER_CYAN: '#00f6ff', METER_BLUE: '#0055ff', SCORE_BLUE: '#00eaff'
    }
  };

  class SoundFX {
    constructor() { this.ctx = null; }
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }
    hit(heavy = false) {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = heavy ? 'sawtooth' : 'triangle';
      osc.frequency.setValueAtTime(heavy ? 180 : 320, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + (heavy ? 0.28 : 0.15));
      gain.gain.setValueAtTime(heavy ? 0.45 : 0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + (heavy ? 0.3 : 0.16));
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + (heavy ? 0.3 : 0.16));
    }
    whoosh() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, t);
      osc.frequency.exponentialRampToValueAtTime(120, t + 0.18);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.18);
    }
    superBeam() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, t);
      osc.frequency.linearRampToValueAtTime(880, t + 0.4);
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.8);
    }
    roundStart() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(523.25, t);
      osc.frequency.setValueAtTime(659.25, t + 0.1);
      osc.frequency.setValueAtTime(783.99, t + 0.2);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.5);
    }
  }
  const SFX = new SoundFX();

  class BackgroundStage {
    constructor() { this.time = 0; this.ferrisAngle = 0; }
    update(dt) { this.time += dt; this.ferrisAngle += dt * 0.25; }
    render(ctx, cameraX) {
      const W = CONFIG.INTERNAL_WIDTH, H = CONFIG.INTERNAL_HEIGHT;
      const skyGrad = ctx.createLinearGradient(0, 0, 0, CONFIG.GROUND_Y);
      skyGrad.addColorStop(0, PALETTE.STAGE.SKY_TOP);
      skyGrad.addColorStop(0.35, PALETTE.STAGE.SKY_MID);
      skyGrad.addColorStop(0.7, PALETTE.STAGE.SKY_LOW);
      skyGrad.addColorStop(1, PALETTE.STAGE.SKY_HORIZON);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H);

      const wheelX = 490 - cameraX * 0.12, wheelY = 145, wheelRadius = 80;
      ctx.strokeStyle = '#ff0077';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(wheelX, wheelY, wheelRadius, 0, Math.PI * 2);
      ctx.stroke();

      for (let i = 0; i < 12; i++) {
        const ang = this.ferrisAngle + (i * Math.PI * 2) / 12;
        const cx = wheelX + Math.cos(ang) * wheelRadius;
        const cy = wheelY + Math.sin(ang) * wheelRadius;
        ctx.fillStyle = PALETTE.STAGE.WHEEL_LIGHTS[i % PALETTE.STAGE.WHEEL_LIGHTS.length];
        ctx.fillRect(cx - 3.5, cy - 3.5, 7, 7);
      }

      const groundGrad = ctx.createLinearGradient(0, CONFIG.GROUND_Y, 0, H);
      groundGrad.addColorStop(0, '#261047');
      groundGrad.addColorStop(1, '#080112');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, CONFIG.GROUND_Y, W, H - CONFIG.GROUND_Y);

      ctx.strokeStyle = '#00f6ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, CONFIG.GROUND_Y);
      ctx.lineTo(W, CONFIG.GROUND_Y);
      ctx.stroke();
    }
  }

  class Fighter {
    constructor(id, name, palette, startX, facing) {
      this.id = id; this.name = name; this.palette = palette; this.startX = startX; this.facing = facing;
      this.reset();
    }
    reset() {
      this.x = this.startX; this.y = CONFIG.GROUND_Y; this.vx = 0; this.vy = 0;
      this.isGrounded = true; this.health = CONFIG.MAX_HEALTH; this.lagHealth = CONFIG.MAX_HEALTH;
      this.meter = 75; this.meterLevel = 0; this.state = 'idle'; this.stateTimer = 0; this.animTimer = 0;
      this.isAttacking = false; this.hasHit = false; this.width = 46; this.height = 84;
    }
    update(dt, opponent, effects) {
      this.stateTimer += dt; this.animTimer += dt * 8;
      this.meter = Math.min(CONFIG.MAX_METER, this.meter + dt * 4);
      this.meterLevel = Math.floor(this.meter / 100);

      if (this.lagHealth > this.health) {
        this.lagHealth = Math.max(this.health, this.lagHealth - dt * 180);
      }
      if (!this.isGrounded) {
        this.vy += CONFIG.GRAVITY; this.y += this.vy; this.x += this.vx;
        if (this.y >= CONFIG.GROUND_Y) {
          this.y = CONFIG.GROUND_Y; this.vy = 0; this.vx = 0; this.isGrounded = true;
          effects.addDust(this.x, this.y);
          if (this.state === 'jump') this.setState('idle');
        }
      } else {
        this.x += this.vx; this.vx *= 0.85;
      }

      const padding = 36;
      if (this.x < padding) this.x = padding;
      if (this.x > CONFIG.INTERNAL_WIDTH - padding) this.x = CONFIG.INTERNAL_WIDTH - padding;
      if (this.state === 'idle' || this.state === 'walk') this.facing = this.x < opponent.x ? 1 : -1;

      if (this.state === 'light_atk') {
        if (this.stateTimer > 0.22) this.setState('idle');
        else if (!this.hasHit && this.stateTimer > 0.06 && this.stateTimer < 0.16) {
          this.checkAttackCollision(opponent, 45, 60, 48, 12, false, effects);
        }
      } else if (this.state === 'heavy_atk') {
        if (this.stateTimer > 0.44) this.setState('idle');
        else if (!this.hasHit && this.stateTimer > 0.12 && this.stateTimer < 0.3) {
          this.checkAttackCollision(opponent, 110, 110, 58, 24, true, effects);
        }
      } else if (this.state === 'super_atk') {
        if (this.stateTimer > 1.1) this.setState('idle');
        else if (Math.floor(this.stateTimer * 30) % 5 === 0) {
          this.checkAttackCollision(opponent, 35, 300, 28, 6, true, effects, true);
        }
      } else if (this.state === 'hit' && this.stateTimer > 0.28) {
        this.setState('idle');
      }
    }
    setState(newState) {
      if (this.state === 'ko') return;
      this.state = newState; this.stateTimer = 0; this.hasHit = false; this.isAttacking = newState.includes('atk');
    }
    takeDamage(amount, isHeavy, effects) {
      this.health = Math.max(0, this.health - amount);
      this.setState('hit');
      this.vx = -this.facing * (isHeavy ? 7 : 3.5);
      this.meter = Math.min(CONFIG.MAX_METER, this.meter + 15);
      SFX.hit(isHeavy);
      effects.addScreenShake(isHeavy ? 12 : 6, isHeavy ? 0.24 : 0.14);
      if (this.health <= 0) {
        this.setState('ko');
        effects.addSuperFlash();
      }
    }
    checkAttackCollision(opponent, damage, rangeX, rangeY, sparkY, isHeavy, effects, isSuper = false) {
      if (opponent.state === 'ko') return;
      const hitboxX = this.facing === 1 ? this.x + 10 : this.x - 10 - rangeX;
      const hitboxY = this.y - 70;
      const oppX = opponent.x - opponent.width / 2;
      const oppY = opponent.y - opponent.height;
      if (hitboxX < oppX + opponent.width && hitboxX + rangeX > oppX && hitboxY < oppY + opponent.height && hitboxY + rangeY > oppY) {
        if (!isSuper) this.hasHit = true;
        opponent.takeDamage(damage, isHeavy, effects);
        effects.addHitSpark(opponent.x - this.facing * 8, this.y - 50 + sparkY, isHeavy || isSuper);
        this.meter = Math.min(CONFIG.MAX_METER, this.meter + (isHeavy ? 25 : 12));
      }
    }
    jump() {
      if (this.isGrounded && this.state !== 'ko' && !this.isAttacking) {
        this.vy = -14.5; this.isGrounded = false; this.setState('jump'); SFX.whoosh();
      }
    }
    lightAttack() {
      if (this.isGrounded && !this.isAttacking && this.state !== 'hit' && this.state !== 'ko') {
        this.setState('light_atk'); SFX.whoosh();
      }
    }
    heavyAttack() {
      if (this.isGrounded && !this.isAttacking && this.state !== 'hit' && this.state !== 'ko') {
        this.setState('heavy_atk'); SFX.whoosh();
      }
    }
    hyperSuperAttack(effects) {
      if (this.isGrounded && !this.isAttacking && this.state !== 'hit' && this.state !== 'ko' && this.meter >= 100) {
        this.meter -= 100; this.setState('super_atk'); SFX.superBeam(); effects.addSuperFlash(); effects.addSpeedLines();
      }
    }
    render(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.scale(this.facing, 1);
      ctx.fillStyle = 'rgba(8, 2, 20, 0.45)';
      ctx.beginPath();
      ctx.ellipse(0, 0, 24, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      const bob = this.state === 'idle' ? Math.sin(this.animTimer * 0.8) * 2.5 : 0;
      const p = this.palette;
      ctx.lineJoin = 'miter';
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = PALETTE.OUTLINE;

      if (this.id === 'kai') {
        ctx.fillStyle = p.GI_SHADOW;
        ctx.fillRect(-18, -42 + bob, 12, 42); ctx.strokeRect(-18, -42 + bob, 12, 42);
        ctx.fillStyle = p.GI_BASE;
        ctx.fillRect(4, -44 + (this.state === 'heavy_atk' ? -18 : 0), 14, 44);
        ctx.strokeRect(4, -44 + (this.state === 'heavy_atk' ? -18 : 0), 14, 44);
        const torsoY = -74 + bob;
        ctx.fillStyle = p.GI_BASE;
        ctx.fillRect(-14, torsoY, 28, 34); ctx.strokeRect(-14, torsoY, 28, 34);
        ctx.fillStyle = p.BELT_BASE;
        ctx.fillRect(-15, torsoY + 28, 30, 7); ctx.strokeRect(-15, torsoY + 28, 30, 7);
        const headY = torsoY - 20;
        ctx.fillStyle = this.state === 'hit' ? '#ff8888' : p.SKIN_BASE;
        ctx.fillRect(-8, headY, 17, 18); ctx.strokeRect(-8, headY, 17, 18);
        ctx.fillStyle = p.ENERGY;
        ctx.fillRect(-2, headY + 5, 9, 4);
        ctx.fillStyle = p.HAIR_BASE;
        ctx.beginPath();
        ctx.moveTo(-16, headY + 4); ctx.lineTo(-24, headY - 14); ctx.lineTo(-12, headY - 10);
        ctx.lineTo(-6, headY - 26); ctx.lineTo(4, headY - 12); ctx.lineTo(16, headY - 24);
        ctx.lineTo(13, headY - 3); ctx.lineTo(8, headY + 6); ctx.closePath(); ctx.fill(); ctx.stroke();

        if (this.state === 'light_atk') {
          ctx.fillStyle = p.GLOVE_BASE;
          ctx.fillRect(8, torsoY + 2, 44, 16); ctx.strokeRect(8, torsoY + 2, 44, 16);
          ctx.fillStyle = p.ENERGY; ctx.fillRect(58, torsoY + 2, 14, 14);
        } else if (this.state === 'heavy_atk') {
          ctx.fillStyle = p.GLOVE_BASE;
          ctx.fillRect(2, torsoY - 35, 18, 38); ctx.strokeRect(2, torsoY - 35, 18, 38);
        } else {
          ctx.fillStyle = p.GLOVE_BASE;
          ctx.fillRect(10, torsoY + 8, 14, 20); ctx.strokeRect(10, torsoY + 8, 14, 20);
        }
        if (this.state === 'super_atk') {
          ctx.save(); ctx.shadowColor = p.ENERGY; ctx.shadowBlur = 20;
          ctx.fillStyle = p.ENERGY; ctx.fillRect(40, torsoY - 14, 460, 48);
          ctx.restore();
        }
      } else {
        ctx.fillStyle = p.ARMOR_SHADOW;
        ctx.fillRect(-16, -42 + bob, 12, 42); ctx.strokeRect(-16, -42 + bob, 12, 42);
        ctx.fillStyle = p.ARMOR_BASE;
        ctx.fillRect(2, -44, 13, 44); ctx.strokeRect(2, -44, 13, 44);
        const torsoY = -72 + bob;
        ctx.fillStyle = p.ARMOR_BASE;
        ctx.fillRect(-12, torsoY, 24, 32); ctx.strokeRect(-12, torsoY, 24, 32);
        const headY = torsoY - 18;
        ctx.fillStyle = this.state === 'hit' ? '#ff8888' : p.SKIN_BASE;
        ctx.fillRect(-6, headY, 15, 16); ctx.strokeRect(-6, headY, 15, 16);
        ctx.fillStyle = p.HAIR_BASE;
        ctx.beginPath();
        ctx.moveTo(-14, headY); ctx.lineTo(-28 + Math.cos(this.animTimer) * 4, headY + 12);
        ctx.lineTo(-12, headY + 18); ctx.lineTo(-4, headY - 16); ctx.lineTo(8, headY - 8);
        ctx.lineTo(14, headY + 6); ctx.lineTo(4, headY + 16); ctx.closePath(); ctx.fill(); ctx.stroke();

        if (this.state === 'light_atk') {
          ctx.fillStyle = p.ARMOR_BASE;
          ctx.fillRect(6, torsoY + 2, 42, 12); ctx.strokeRect(6, torsoY + 2, 42, 12);
          ctx.fillStyle = p.ENERGY; ctx.beginPath(); ctx.moveTo(48, torsoY - 2); ctx.lineTo(66, torsoY + 8); ctx.lineTo(48, torsoY + 18); ctx.closePath(); ctx.fill();
        } else if (this.state === 'heavy_atk') {
          ctx.fillStyle = p.ARMOR_BASE;
          ctx.fillRect(4, torsoY - 32, 14, 38); ctx.strokeRect(4, torsoY - 32, 14, 38);
        } else {
          ctx.fillStyle = p.ARMOR_BASE;
          ctx.fillRect(8, torsoY + 6, 12, 18); ctx.strokeRect(8, torsoY + 6, 12, 18);
        }
        if (this.state === 'super_atk') {
          ctx.save(); ctx.shadowColor = p.ENERGY; ctx.shadowBlur = 24; ctx.fillStyle = p.ENERGY;
          ctx.beginPath(); ctx.arc(0, torsoY + 10, 65, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }
      }
      ctx.restore();
    }
  }

  class EffectsManager {
    constructor() { this.sparks = []; this.dust = []; this.shakeDuration = 0; this.shakeIntensity = 0; this.superFlashTimer = 0; this.speedLinesActive = 0; this.comboHits = 0; this.comboTimer = 0; }
    addHitSpark(x, y, isHeavy) {
      this.comboHits++; this.comboTimer = 1.6;
      for (let i = 0; i < (isHeavy ? 18 : 10); i++) {
        const ang = Math.PI * 2 * Math.random(), spd = (Math.random() * 4 + 3) * (isHeavy ? 1.7 : 1.0);
        this.sparks.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, size: Math.random() * 4 + 3, color: Math.random() > 0.4 ? '#ffea00' : '#00f6ff', life: 1.0, decay: Math.random() * 3 + 4 });
      }
      this.sparks.push({ x, y, isBurst: true, size: isHeavy ? 36 : 22, life: 1.0, decay: 12 });
    }
    addDust(x, y) { for (let i = -1; i <= 1; i += 2) this.dust.push({ x: x + i * 8, y: y - 2, vx: i * 2, vy: -1, size: 5, life: 1.0, decay: 3.5 }); }
    addScreenShake(intensity, duration) { this.shakeIntensity = intensity; this.shakeDuration = duration; }
    addSuperFlash() { this.superFlashTimer = 0.22; }
    addSpeedLines() { this.speedLinesActive = 0.6; }
    update(dt) {
      if (this.shakeDuration > 0) this.shakeDuration -= dt;
      if (this.superFlashTimer > 0) this.superFlashTimer -= dt;
      if (this.speedLinesActive > 0) this.speedLinesActive -= dt;
      if (this.comboTimer > 0) { this.comboTimer -= dt; if (this.comboTimer <= 0) this.comboHits = 0; }
      for (let i = this.sparks.length - 1; i >= 0; i--) {
        const s = this.sparks[i]; s.life -= s.decay * dt; if (!s.isBurst) { s.x += s.vx; s.y += s.vy; }
        if (s.life <= 0) this.sparks.splice(i, 1);
      }
      for (let i = this.dust.length - 1; i >= 0; i--) {
        const d = this.dust[i]; d.life -= d.decay * dt; d.x += d.vx; d.y += d.vy;
        if (d.life <= 0) this.dust.splice(i, 1);
      }
    }
    applyCamera(ctx) {
      if (this.shakeDuration > 0) ctx.translate((Math.random() * 2 - 1) * this.shakeIntensity, (Math.random() * 2 - 1) * this.shakeIntensity);
    }
    render(ctx) {
      for (const s of this.sparks) {
        if (s.isBurst) {
          ctx.save(); ctx.translate(s.x, s.y); ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          const r = s.size * s.life;
          for (let p = 0; p < 8; p++) {
            const rad = (p * Math.PI) / 4, dist = p % 2 === 0 ? r : r * 0.35;
            const px = Math.cos(rad) * dist, py = Math.sin(rad) * dist;
            if (p === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath(); ctx.fill(); ctx.restore();
        } else {
          ctx.fillStyle = s.color; ctx.fillRect(s.x, s.y, s.size * s.life, s.size * s.life);
        }
      }
      if (this.superFlashTimer > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.superFlashTimer * 3.5})`;
        ctx.fillRect(0, 0, CONFIG.INTERNAL_WIDTH, CONFIG.INTERNAL_HEIGHT);
      }
      if (this.comboHits >= 2) {
        ctx.save(); ctx.font = '900 italic 28px Impact, sans-serif';
        ctx.fillStyle = '#ffea00'; ctx.fillText(`${this.comboHits} HITS!`, 46, 124);
        ctx.restore();
      }
    }
  }

  class ArcadeHUD {
    constructor() { this.timer = CONFIG.TIMER_START; this.timerTick = 0; }
    reset() { this.timer = CONFIG.TIMER_START; this.timerTick = 0; }
    update(dt, isGameOver, isIntro) {
      if (!isGameOver && !isIntro) {
        this.timerTick += dt;
        if (this.timerTick >= 1.0) { this.timerTick = 0; this.timer = Math.max(0, this.timer - 1); }
      }
    }
    render(ctx, p1, p2, introTimer) {
      const W = CONFIG.INTERNAL_WIDTH;
      ctx.save();
      ctx.font = '900 italic 11px Impact, sans-serif';
      ctx.fillStyle = PALETTE.HUD.SCORE_BLUE;
      ctx.fillText('SCORE 1P: 00894200', 16, 16);
      ctx.textAlign = 'right';
      ctx.fillStyle = Math.floor(Date.now() / 450) % 2 === 0 ? PALETTE.HUD.FRAME_GOLD : '#ff7700';
      ctx.fillText('★ FREE PLAY ★', W - 16, 16);
      ctx.restore();

      this.drawHealthBar(ctx, p1, 14, 24, 240, false);
      this.drawHealthBar(ctx, p2, W - 14 - 240, 24, 240, true);
      this.drawCenterTimer(ctx, W / 2, 40, this.timer);
      this.drawSuperMeter(ctx, p1, 18, CONFIG.INTERNAL_HEIGHT - 32, 210, false);
      this.drawSuperMeter(ctx, p2, W - 18 - 210, CONFIG.INTERNAL_HEIGHT - 32, 210, true);

      if (introTimer > 0) {
        ctx.save(); ctx.textAlign = 'center'; ctx.font = '900 italic 42px Impact, sans-serif';
        ctx.fillStyle = introTimer > 1.0 ? '#00f6ff' : '#ffea00';
        ctx.shadowColor = '#00f6ff'; ctx.shadowBlur = 15;
        ctx.fillText(introTimer > 1.0 ? 'ROUND 1' : 'FIGHT!', W / 2, CONFIG.INTERNAL_HEIGHT / 2);
        ctx.restore();
      }

      if (p1.health <= 0 || p2.health <= 0 || this.timer === 0) {
        ctx.save(); ctx.textAlign = 'center'; ctx.font = '900 italic 46px Impact, sans-serif';
        ctx.fillStyle = '#ffea00'; ctx.shadowColor = '#ff003c'; ctx.shadowBlur = 20;
        ctx.fillText('K. O. !', W / 2, CONFIG.INTERNAL_HEIGHT / 2 - 15);
        ctx.font = 'bold italic 18px Impact, sans-serif';
        ctx.fillStyle = '#00f6ff';
        ctx.fillText(p1.health > p2.health ? 'PLAYER 1 WINS!' : 'PLAYER 2 WINS!', W / 2, CONFIG.INTERNAL_HEIGHT / 2 + 18);
        ctx.restore();
      }
    }
    drawHealthBar(ctx, fighter, x, y, width, isRightSide) {
      const height = 18, slant = 14;
      ctx.save();
      ctx.fillStyle = PALETTE.HUD.LIFE_BG;
      ctx.beginPath();
      if (!isRightSide) {
        ctx.moveTo(x - slant, y); ctx.lineTo(x + width, y); ctx.lineTo(x + width - slant, y + height); ctx.lineTo(x, y + height);
      } else {
        ctx.moveTo(x, y); ctx.lineTo(x + width + slant, y); ctx.lineTo(x + width, y + height); ctx.lineTo(x + slant, y + height);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = PALETTE.HUD.FRAME_PURPLE; ctx.lineWidth = 3; ctx.stroke();

      const lagW = (width - 4) * (fighter.lagHealth / CONFIG.MAX_HEALTH);
      ctx.fillStyle = PALETTE.HUD.LIFE_GHOST;
      ctx.fillRect(isRightSide ? x + width - lagW : x + 2, y + 2, lagW, height - 4);

      const hpW = (width - 4) * (fighter.health / CONFIG.MAX_HEALTH);
      ctx.fillStyle = (fighter.health / CONFIG.MAX_HEALTH) > 0.4 ? PALETTE.HUD.LIFE_GREEN : PALETTE.HUD.LIFE_RED;
      ctx.fillRect(isRightSide ? x + width - hpW : x + 2, y + 2, hpW, height - 4);

      const portraitX = isRightSide ? x + width + 8 : x - 32;
      ctx.fillStyle = '#0c0418'; ctx.fillRect(portraitX, y - 2, 26, 26);
      ctx.strokeStyle = PALETTE.HUD.FRAME_GOLD; ctx.lineWidth = 2; ctx.strokeRect(portraitX, y - 2, 26, 26);
      ctx.fillStyle = fighter.palette.HAIR_BASE; ctx.fillRect(portraitX + 5, y + 3, 16, 16);

      ctx.textAlign = isRightSide ? 'right' : 'left';
      ctx.font = '900 italic 12px Impact, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(fighter.name, isRightSide ? x + width - 6 : x + 6, y + 14);
      ctx.restore();
    }
    drawCenterTimer(ctx, cx, cy, time) {
      ctx.save();
      ctx.fillStyle = '#120524'; ctx.beginPath(); ctx.ellipse(cx, cy, 28, 22, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = PALETTE.HUD.FRAME_GOLD; ctx.lineWidth = 3.5; ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '900 24px Impact, sans-serif';
      ctx.fillStyle = time <= 10 ? '#ff1438' : '#ffffff';
      ctx.fillText(time.toString().padStart(2, '0'), cx, cy + 1);
      ctx.font = 'bold italic 9px Impact, sans-serif'; ctx.fillStyle = PALETTE.HUD.FRAME_GOLD;
      ctx.fillText('ROUND 1', cx, cy + 24);
      ctx.restore();
    }
    drawSuperMeter(ctx, fighter, x, y, width, isRightSide) {
      const height = 14;
      ctx.save();
      ctx.fillStyle = '#0f0520'; ctx.fillRect(x, y, width, height);
      ctx.strokeStyle = '#5a2291'; ctx.lineWidth = 2.5; ctx.strokeRect(x, y, width, height);
      const fillW = (width - 4) * (fighter.meter / CONFIG.MAX_METER);
      ctx.fillStyle = PALETTE.HUD.METER_CYAN;
      ctx.fillRect(isRightSide ? x + width - fillW : x + 2, y + 2, fillW, height - 4);
      const badgeX = isRightSide ? x - 18 : x + width + 18, badgeY = y + height / 2;
      ctx.fillStyle = '#ffea00'; ctx.beginPath(); ctx.arc(badgeX, badgeY, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#080112'; ctx.font = '900 italic 12px Impact, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`LV${fighter.meterLevel}`, badgeX, badgeY);
      ctx.restore();
    }
  }

  class Game {
    constructor() {
      this.canvas = document.getElementById('viewport');
      this.ctx = this.canvas.getContext('2d', { alpha: false });
      this.keys = {};
      this.stage = new BackgroundStage();
      this.effects = new EffectsManager();
      this.hud = new ArcadeHUD();
      this.p1 = new Fighter('kai', 'VOLT-KAI', PALETTE.KAI, 180, 1);
      this.p2 = new Fighter('vexa', 'VEXA-9', PALETTE.VEXA, 460, -1);
      this.isAiEnabled = true;
      this.aiTimer = 0;
      this.introTimer = 2.5;
      this.lastTime = performance.now();
      this.rematchBanner = document.getElementById('rematch-banner');

      this.initInput();
      this.initControls();
    }
    restartMatch() {
      this.p1.reset(); this.p2.reset(); this.hud.reset();
      this.introTimer = 2.5; this.rematchBanner.style.display = 'none';
      SFX.init(); SFX.roundStart();
    }
    initInput() {
      window.addEventListener('keydown', (e) => {
        this.keys[e.code] = true;
        SFX.init();
        const isGameOver = this.p1.health <= 0 || this.p2.health <= 0 || this.hud.timer === 0;
        if (isGameOver && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR')) {
          this.restartMatch();
        }
      });
      window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });

      const bindBtn = (id, keyCode) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        const press = (e) => {
          if (e.cancelable) e.preventDefault();
          this.keys[keyCode] = true;
          btn.classList.add('pressed');
          SFX.init();
        };
        const release = (e) => {
          if (e.cancelable) e.preventDefault();
          this.keys[keyCode] = false;
          btn.classList.remove('pressed');
        };
        btn.addEventListener('pointerdown', press);
        btn.addEventListener('pointerup', release);
        btn.addEventListener('pointercancel', release);
      };

      bindBtn('t-left', 'ArrowLeft');
      bindBtn('t-right', 'ArrowRight');
      bindBtn('t-jump', 'Space');
      bindBtn('t-light', 'KeyZ');
      bindBtn('t-heavy', 'KeyX');
      bindBtn('t-super', 'KeyC');
      bindBtn('t-assist', 'KeyV');

      document.getElementById('btn-rematch').addEventListener('click', () => this.restartMatch());
      document.getElementById('btn-restart-now').addEventListener('click', () => this.restartMatch());
    }
    initControls() {
      const crtBtn = document.getElementById('toggle-crt');
      const crtOverlay = document.getElementById('crt');
      crtBtn.addEventListener('click', () => crtOverlay.classList.toggle('disabled'));

      const aiBtn = document.getElementById('toggle-ai');
      aiBtn.addEventListener('click', () => {
        this.isAiEnabled = !this.isAiEnabled;
        aiBtn.innerText = this.isAiEnabled ? 'AI: AUTO' : 'AI: OFF (P2)';
        aiBtn.style.background = this.isAiEnabled ? '#00d9ff' : '#ffe600';
      });
    }
    update(dt) {
      const cameraX = (this.p1.x + this.p2.x) / 2 - CONFIG.INTERNAL_WIDTH / 2;
      this.stage.update(dt);
      this.effects.update(dt);
      if (this.introTimer > 0) this.introTimer -= dt;

      const isGameOver = this.p1.health <= 0 || this.p2.health <= 0 || this.hud.timer === 0;
      this.hud.update(dt, isGameOver, this.introTimer > 0);

      if (isGameOver) {
        this.rematchBanner.style.display = 'flex';
      } else {
        this.rematchBanner.style.display = 'none';
        if (this.introTimer <= 0 && this.p1.state !== 'hit' && !this.p1.isAttacking) {
          if (this.keys['ArrowLeft']) { this.p1.vx = -4.2; this.p1.setState('walk'); }
          else if (this.keys['ArrowRight']) { this.p1.vx = 4.2; this.p1.setState('walk'); }
          else if (this.p1.isGrounded) { this.p1.vx = 0; if (this.p1.state === 'walk') this.p1.setState('idle'); }

          if (this.keys['Space'] || this.keys['ArrowUp']) this.p1.jump();
          if (this.keys['KeyZ']) this.p1.lightAttack();
          else if (this.keys['KeyX']) this.p1.heavyAttack();
          else if (this.keys['KeyC']) this.p1.hyperSuperAttack(this.effects);
          else if (this.keys['KeyV']) this.effects.addSpeedLines();
        }
        if (this.introTimer <= 0 && this.isAiEnabled) this.updateAi(dt);
      }
      this.p1.update(dt, this.p2, this.effects);
      this.p2.update(dt, this.p1, this.effects);
    }
    updateAi(dt) {
      if (this.p2.state === 'hit' || this.p2.isAttacking || this.p2.state === 'ko') return;
      this.aiTimer += dt;
      const dist = Math.abs(this.p1.x - this.p2.x);
      if (dist > 150) {
        this.p2.vx = this.p2.x > this.p1.x ? -2.5 : 2.5;
        this.p2.setState('walk');
      } else {
        this.p2.vx = 0;
        if (this.aiTimer > 0.8) {
          this.aiTimer = 0;
          const choice = Math.random();
          if (choice < 0.4) this.p2.lightAttack();
          else if (choice < 0.7) this.p2.heavyAttack();
          else if (this.p2.meter >= 100 && choice < 0.85) this.p2.hyperSuperAttack(this.effects);
          else if (choice < 0.95) this.p2.jump();
        }
      }
    }
    render() {
      const cameraX = (this.p1.x + this.p2.x) / 2 - CONFIG.INTERNAL_WIDTH / 2;
      this.ctx.save();
      this.effects.applyCamera(this.ctx);
      this.stage.render(this.ctx, cameraX);
      this.p1.render(this.ctx);
      this.p2.render(this.ctx);
      this.effects.render(this.ctx);
      this.hud.render(this.ctx, this.p1, this.p2, this.introTimer);
      this.ctx.restore();
    }
    loop(time) {
      const dt = Math.min(0.05, (time - this.lastTime) / 1000);
      this.lastTime = time;
      this.update(dt);
      this.render();
      requestAnimationFrame((t) => this.loop(t));
    }
    start() { requestAnimationFrame((t) => this.loop(t)); }
  }

  window.addEventListener('load', () => {
    const game = new Game();
    game.start();
  });
  </script>
